[hierarchy]
info = "Base governance contract generated for a new project-local Ant-Delirium package. Adjust repository anchoring, target folders, dependency policy, and any project-specific limits after bootstrap."
casing = "PascalCase"
name_separator = "-"
tag_separator = "_"
manifest = true
recursion = true
md_min_chars = 80
doc_tags = true
what_mission = true
why_justification = true
usage_example = true
test_case_mapping = true
inheritance_visibility = true
root_manifest = true
root_md_pairing = true
repository = "__ANT_DELIRIUM_REPOSITORY__"
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"

[hierarchy.permissions]
info = "Global dependency and token governance. Keep libres empty during bootstrap if you still need to map the dependency policy for a new repository."
libres = []
wrapper_boundary_contract = "explicit_ac_alias"
restricted_tokens = { "panic!" = "Security: Use Result.", "unwrap" = "Security: Use expect()." }

[hierarchy.files]
info = "Default file-governance branch applied to governed Rust files before specialization by DNA."
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"
md_pairing = true

[hierarchy.target]
info = "Runtime target mapping for a standard Rust project bootstrap. Expand these folders for workspace members after installation."
core = ["src"]
tests = ["tests"]
macros = ["src/macros"]

[hierarchy.ignore.plugins]
info = "Ignore the shared project-local plugin package from ordinary governance backlog generation."
ignore = true
match = "plugins"

[hierarchy.ignore.props]
info = "Ignore generated AC_Ant-Delirium runtime props from ordinary governance backlog generation."
ignore = true
match = "AC_Ant-Delirium_props"

[hierarchy.installation]
active = true
agent_command = "./guard"

[hierarchy.installation.config]

[hierarchy.installation.build]

[hierarchy.installation.build.strict]

[hierarchy.installation.api]

[hierarchy.installation.shadow_context]

[hierarchy.installation.security]

[hierarchy.files.unit]
info = "Public-facing unit DNA."
jurisdiction = "src"
type_logic = ["pub fn", "pub async fn", "pub const fn", "pub unsafe fn", "pub(crate) fn", "pub(crate) async fn", "pub(crate) const fn"]
md_pairing = true
manifest = true
max_nesting = 2
max_params = 4
logical_density = 25
else_free = true

[hierarchy.files.unit.documentation]
info = "Documentation contract for public unit files."

[hierarchy.files.unit.documentation.what]
min = 64
info = "Describe what this public unit function or declaration does in externally relevant terms."

[hierarchy.files.unit.documentation.why]
min = 64
info = "Explain why this public unit symbol exists and which design pressure or boundary it answers."

[hierarchy.files.unit.documentation.usage]
min = 64
info = "Explain how this public unit symbol should be called, consumed, or observed in practice."

[hierarchy.files.unit.documentation.test]
min = 48
info = "Describe the validation path, test scenario, or verification contract for this public unit symbol."

[hierarchy.files.unit.unitcore]
info = "Internal unitcore DNA."
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
max_params = 6
logical_density = 40
else_free = true

[hierarchy.files.unit.unitcore.documentation]
info = "Documentation contract for unitcore declarations."

[hierarchy.files.unit.unitcore.documentation.what]
min = 64
info = "Describe what this internal implementation symbol does."

[hierarchy.files.unit.unitcore.documentation.why]
min = 64
info = "Explain why this internal implementation exists in unitcore instead of the parent public unit layer."

[hierarchy.files.unit.unitcore.documentation.usage]
min = 64
info = "Explain how this internal implementation is invoked or composed by the parent unit."

[hierarchy.files.test]
info = "Test DNA branch."
jurisdiction = "tests"
type_logic = ["#[test]", "#[tokio::test]", "#[cfg(test)]"]
manifest = false
md_pairing = false
else_free = false

[hierarchy.files.struct]
info = "Structural type DNA for domain data definitions."
jurisdiction = "src/struct"
type_logic = ["struct", "pub struct", "enum", "pub enum"]
md_pairing = true
manifest = true

[hierarchy.files.struct.documentation]
info = "Documentation contract for structural type files."

[hierarchy.files.struct.documentation.what]
min = 64
info = "Describe what this structural type or public declaration represents."

[hierarchy.files.struct.documentation.why]
min = 64
info = "Explain why this structural type exists and which domain or architectural need it stabilizes."

[hierarchy.files.struct.documentation.usage]
min = 64
info = "Explain how this structural type should be instantiated, consumed, or extended."

[hierarchy.files.struct.documentation.test]
min = 48
info = "Describe the validation path or invariants that prove this structural contract remains correct."

[hierarchy.files.struct.structcore]
info = "Internal structcore DNA."
type_logic = ["fn", "async fn", "const fn", "unsafe fn", "impl"]
manifest = false
max_nesting = 3
max_params = 4
logical_density = 30
else_free = true

[hierarchy.files.struct.structcore.documentation]
info = "Documentation contract for structcore internals."

[hierarchy.files.struct.structcore.documentation.what]
min = 64
info = "Describe what this structcore helper or impl-level routine does."

[hierarchy.files.struct.structcore.documentation.why]
min = 64
info = "Explain why this structcore helper exists and why the logic stays attached to the structural layer."

[hierarchy.files.struct.structcore.documentation.usage]
min = 64
info = "Explain how this structcore helper is called or composed by the parent structural surface."

[hierarchy.files.macro]
info = "Macro DNA branch."
jurisdiction = "src/macros"
type_logic = ["macro_rules!", "pub macro"]
md_pairing = true
manifest = true

[hierarchy.files.macro.documentation]
info = "Documentation contract for macro files."

[hierarchy.files.macro.documentation.what]
min = 64
info = "Describe what code-generation or abstraction surface this macro provides."

[hierarchy.files.macro.documentation.why]
min = 64
info = "Explain why this macro exists instead of a plain function or type-level abstraction."

[hierarchy.files.macro.documentation.usage]
min = 64
info = "Explain how this macro should be invoked and what operational contract callers should expect."

[hierarchy.files.macro.documentation.test]
min = 48
info = "Describe the validation path or macro-level scenarios that prove this public macro contract."

[hierarchy.files.macro.macrocore]
info = "Internal macrocore DNA."
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
logical_density = 40
else_free = true

[hierarchy.files.macro.macrocore.documentation]
info = "Documentation contract for macrocore helpers."

[hierarchy.files.macro.macrocore.documentation.what]
min = 64
info = "Describe what this macrocore helper does for the macro expansion pipeline."

[hierarchy.files.macro.macrocore.documentation.why]
min = 64
info = "Explain why this helper exists in macrocore and what expansion concern it isolates."

[hierarchy.files.macro.macrocore.documentation.usage]
min = 64
info = "Explain how this macrocore helper is invoked or consumed by the parent macro layer."

[hierarchy.orchestration]
min_passing_grade = 7.0

[hierarchy.orchestration.cargo_warning]
enabled = true
manifest = "AC_Ant-Delirium_props/Logs/artifacts/to-do_list_manifest.json"
pending_template = "[Plan {plan_id}] {pending_tasks} tasks pending ({mode} mode). Manifest: {manifest}. ({instruction})"
generation_template = "[Plan {plan_id}] Task Generation Mode Active. Manifest: {manifest}. Create specific implementation tasks with ./guard --api 'hierarchy.task.[{plan_id}].add_task=Write a complete task prompt here', then close task generation with ./guard --api 'hierarchy.task.[{plan_id}].needs_more_tasks=false'. Do not edit task_orchestrator.json or plan JSON files directly."
implementation_instruction = "Complete a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].implemented=true Your explanation here'"
plan_review_instruction = "Audit a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].task_reviewed=true Your explanation here'"
implementation_review_instruction = "Review a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].review_status=approved Your explanation here' or use rejected"
