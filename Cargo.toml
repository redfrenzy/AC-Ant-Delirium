[package]
name = "ac_ant_delirium"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "antdelirium"
path = "src/main.rs"

[dependencies]
gix = "0.85.0"
libc = "=0.2.186"
rusqlite = { version = "=0.37.0", default-features = false, features = ["backup", "bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
toml_edit = { version = "=0.25.12", default-features = false, features = ["parse", "display"] }

[profile.release]
strip = "symbols"
