[package]
name = "ac_ant_delirium"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "antdelirium"
path = "src/main.rs"

[dependencies]
gix = "0.85.0"
libc = "=0.2.186"
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }
sha2 = "=0.10.9"
