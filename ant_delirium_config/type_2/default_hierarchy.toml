[rules]
casing = "PascalCase"
name_separator = "-"
tag_separator = "_"
manifest = true
recursion = true
md_min_chars = 80
what_mission = true
why_justification = true
usage_example = true
test_case_mapping = true
doc_tags = true
inheritance_visibility = true
root_manifest = true
root_md_pairing = true
repository = "/home/dracker/aesthetic-core"
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"

[rules.permissions]
libres = ["ac_ant_delirium", "rayon", "rusqlite", "sha2", "std"]
wrapper_boundary_contract = "explicit_ac_alias"
restricted_tokens = { "panic!" = "Security: Use Result.", "unwrap" = "Security: Use expect()." }

[rules.fichiers]
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"
md_pairing = true
[rules.target]
core =  ["src/exemples_error/type2"]
tests = "src/tests"
macros = "src/macros"

[rules.installation]

[rules.installation.config]

[rules.installation.build]

[rules.installation.build.strict]

[rules.installation.api]

[rules.installation.shadow_context]

[rules.installation.security]

[rules.fichiers.unite]
jurisdiction = "src"
type_logic = ["pub fn", "pub async fn", "pub const fn", "pub unsafe fn", "pub(crate) fn", "pub(crate) async fn", "pub(crate) const fn"]
md_pairing = true
manifest = true
max_nesting = 2
max_params = 4
logical_density = 25
else_free = true
[rules.fichiers.unite.documentation]
[rules.fichiers.unite.documentation.what]
min = 64
info = "Describe what this public unit declaration does."
[rules.fichiers.unite.documentation.why]
min = 64
info = "Explain why this public unit declaration exists."
[rules.fichiers.unite.documentation.usage]
min = 64
info = "Explain how this public unit declaration should be used."
[rules.fichiers.unite.documentation.test]
min = 48
info = "Describe the validation path for this public unit declaration."

[rules.fichiers.unite.unitecore]
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
max_params = 6
logical_density = 40
else_free = true
[rules.fichiers.unite.unitecore.documentation]
[rules.fichiers.unite.unitecore.documentation.what]
min = 64
info = "Describe what this internal unitcore declaration does."
[rules.fichiers.unite.unitecore.documentation.why]
min = 64
info = "Explain why this internal unitcore declaration exists."
[rules.fichiers.unite.unitecore.documentation.usage]
min = 64
info = "Explain how this internal unitcore declaration is used by the parent unit."

[rules.fichiers.tests]
jurisdiction = "src/tests"
type_logic = ["#[test]", "#[tokio::test]", "#[cfg(test)]"]
manifest = false
md_pairing = false
else_free = false

[rules.fichiers.structure]
jurisdiction = "src/struct"
type_logic = ["struct", "pub struct", "enum", "pub enum"]
md_pairing = true
manifest = true
[rules.fichiers.structure.documentation]
[rules.fichiers.structure.documentation.what]
min = 64
info = "Describe what this structural declaration represents."
[rules.fichiers.structure.documentation.why]
min = 64
info = "Explain why this structural declaration exists."
[rules.fichiers.structure.documentation.usage]
min = 64
info = "Explain how this structural declaration should be used."
[rules.fichiers.structure.documentation.test]
min = 48
info = "Describe the validation path for this structural declaration."
[rules.fichiers.structure.structurecore]
type_logic = ["fn", "async fn", "const fn", "unsafe fn", "impl"]
manifest = false
max_nesting = 3
max_params = 4
logical_density = 30
else_free = true
[rules.fichiers.structure.structurecore.documentation]
[rules.fichiers.structure.structurecore.documentation.what]
min = 64
info = "Describe what this internal structurecore helper does."
[rules.fichiers.structure.structurecore.documentation.why]
min = 64
info = "Explain why this internal structurecore helper exists."
[rules.fichiers.structure.structurecore.documentation.usage]
min = 64
info = "Explain how this internal structurecore helper is used by the parent structure."

[rules.fichiers.macro]
jurisdiction = "src/macros"
type_logic = ["macro_rules!", "pub macro"]
md_pairing = true
manifest = true
[rules.fichiers.macro.documentation]
[rules.fichiers.macro.documentation.what]
min = 64
info = "Describe what this public macro provides."
[rules.fichiers.macro.documentation.why]
min = 64
info = "Explain why this public macro exists."
[rules.fichiers.macro.documentation.usage]
min = 64
info = "Explain how this public macro should be used."
[rules.fichiers.macro.documentation.test]
min = 48
info = "Describe the validation path for this public macro."
[rules.fichiers.macro.macrocore]
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
logical_density = 40
else_free = true
[rules.fichiers.macro.macrocore.documentation]
[rules.fichiers.macro.macrocore.documentation.what]
min = 64
info = "Describe what this internal macrocore helper does."
[rules.fichiers.macro.macrocore.documentation.why]
min = 64
info = "Explain why this internal macrocore helper exists."
[rules.fichiers.macro.macrocore.documentation.usage]
min = 64
info = "Explain how this internal macrocore helper is used by the parent macro."

[rules.orchestration]
min_passing_grade = 7.0

[rules.orchestration.cargo_warning]
enabled = true
manifest = "AC_Ant-Delirium_props/Logs/artifacts/to-do_list_manifest.json"
pending_template = "[Plan {plan_id}] {pending_tasks} tasks pending ({mode} mode). Manifest: {manifest}. ({instruction})"
generation_template = "[Plan {plan_id}] Task Generation Mode Active. Manifest: {manifest}. Create specific implementation tasks with ./guard --api 'hierarchy.task.[{plan_id}].add_task=Write a complete task prompt here', then close task generation with ./guard --api 'hierarchy.task.[{plan_id}].needs_more_tasks=false'. Do not edit task_orchestrator.json or plan JSON files directly."
implementation_instruction = "Complete a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].implemented=true Your explanation here'"
plan_review_instruction = "Audit a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].task_reviewed=true Your explanation here'"
implementation_review_instruction = "Review a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].review_status=approved Your explanation here' or use rejected"
