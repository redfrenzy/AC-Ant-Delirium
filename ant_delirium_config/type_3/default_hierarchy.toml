[regras]
casing = "PascalCase"
name_separator = "-"
tag_separator = "_"
manifest = true
recursion = true
md_min_chars = 80
what_mission = true
why_justification = true
usage_example = true
test_case_mapping = true
doc_tags = true
inheritance_visibility = true
root_manifest = true
root_md_pairing = true
repository = "/home/dracker/aesthetic-core"
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"

[regras.permissions]
libres = ["ac_ant_delirium", "rayon", "rusqlite", "sha2", "std"]
wrapper_boundary_contract = "explicit_ac_alias"
restricted_tokens = { "panic!" = "Security: Use Result.", "unwrap" = "Security: Use expect()." }

[regras.arquivos]
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"
md_pairing = true
[regras.target]
core =  ["src/exemples_error/type3"]
tests = "src/tests"
macros = "src/macros"

[regras.installation]

[regras.installation.config]

[regras.installation.build]

[regras.installation.build.strict]

[regras.installation.api]

[regras.installation.shadow_context]

[regras.installation.security]

[regras.arquivos.unidade]
jurisdiction = "src"
type_logic = ["pub fn", "pub async fn", "pub const fn", "pub unsafe fn", "pub(crate) fn", "pub(crate) async fn", "pub(crate) const fn"]
md_pairing = true
manifest = true
max_nesting = 2
max_params = 4
logical_density = 25
else_free = true
[regras.arquivos.unidade.documentation]
[regras.arquivos.unidade.documentation.what]
min = 64
info = "Describe what this public unit declaration does."
[regras.arquivos.unidade.documentation.why]
min = 64
info = "Explain why this public unit declaration exists."
[regras.arquivos.unidade.documentation.usage]
min = 64
info = "Explain how this public unit declaration should be used."
[regras.arquivos.unidade.documentation.test]
min = 48
info = "Describe the validation path for this public unit declaration."

[regras.arquivos.unidade.unidade_nucleo]
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
max_params = 6
logical_density = 40
else_free = true
[regras.arquivos.unidade.unidade_nucleo.documentation]
[regras.arquivos.unidade.unidade_nucleo.documentation.what]
min = 64
info = "Describe what this internal unidade_nucleo declaration does."
[regras.arquivos.unidade.unidade_nucleo.documentation.why]
min = 64
info = "Explain why this internal unidade_nucleo declaration exists."
[regras.arquivos.unidade.unidade_nucleo.documentation.usage]
min = 64
info = "Explain how this internal unidade_nucleo declaration is used by the parent unit."

[regras.arquivos.teste]
jurisdiction = "src/tests"
type_logic = ["#[test]", "#[tokio::test]", "#[cfg(test)]"]
manifest = false
md_pairing = false
else_free = false

[regras.arquivos.estrutura]
jurisdiction = "src/struct"
type_logic = ["struct", "pub struct", "enum", "pub enum"]
md_pairing = true
manifest = true
[regras.arquivos.estrutura.documentation]
[regras.arquivos.estrutura.documentation.what]
min = 64
info = "Describe what this structural declaration represents."
[regras.arquivos.estrutura.documentation.why]
min = 64
info = "Explain why this structural declaration exists."
[regras.arquivos.estrutura.documentation.usage]
min = 64
info = "Explain how this structural declaration should be used."
[regras.arquivos.estrutura.documentation.test]
min = 48
info = "Describe the validation path for this structural declaration."
[regras.arquivos.estrutura.estrutura_nucleo]
type_logic = ["fn", "async fn", "const fn", "unsafe fn", "impl"]
manifest = false
max_nesting = 3
max_params = 4
logical_density = 30
else_free = true
[regras.arquivos.estrutura.estrutura_nucleo.documentation]
[regras.arquivos.estrutura.estrutura_nucleo.documentation.what]
min = 64
info = "Describe what this internal estrutura_nucleo helper does."
[regras.arquivos.estrutura.estrutura_nucleo.documentation.why]
min = 64
info = "Explain why this internal estrutura_nucleo helper exists."
[regras.arquivos.estrutura.estrutura_nucleo.documentation.usage]
min = 64
info = "Explain how this internal estrutura_nucleo helper is used by the parent structure."

[regras.arquivos.macro]
jurisdiction = "src/macros"
type_logic = ["macro_rules!", "pub macro"]
md_pairing = true
manifest = true
[regras.arquivos.macro.documentation]
[regras.arquivos.macro.documentation.what]
min = 64
info = "Describe what this public macro provides."
[regras.arquivos.macro.documentation.why]
min = 64
info = "Explain why this public macro exists."
[regras.arquivos.macro.documentation.usage]
min = 64
info = "Explain how this public macro should be used."
[regras.arquivos.macro.documentation.test]
min = 48
info = "Describe the validation path for this public macro."
[regras.arquivos.macro.macro_nucleo]
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
logical_density = 40
else_free = true
[regras.arquivos.macro.macro_nucleo.documentation]
[regras.arquivos.macro.macro_nucleo.documentation.what]
min = 64
info = "Describe what this internal macro_nucleo helper does."
[regras.arquivos.macro.macro_nucleo.documentation.why]
min = 64
info = "Explain why this internal macro_nucleo helper exists."
[regras.arquivos.macro.macro_nucleo.documentation.usage]
min = 64
info = "Explain how this internal macro_nucleo helper is used by the parent macro."

[regras.orchestration]
min_passing_grade = 7.0

[regras.orchestration.cargo_warning]
enabled = true
manifest = "AC_Ant-Delirium_props/Logs/artifacts/to-do_list_manifest.json"
pending_template = "[Plan {plan_id}] {pending_tasks} tasks pending ({mode} mode). Manifest: {manifest}. ({instruction})"
generation_template = "[Plan {plan_id}] Task Generation Mode Active. Manifest: {manifest}. Create specific implementation tasks with ./guard --api 'hierarchy.task.[{plan_id}].add_task=Write a complete task prompt here', then close task generation with ./guard --api 'hierarchy.task.[{plan_id}].needs_more_tasks=false'. Do not edit task_orchestrator.json or plan JSON files directly."
implementation_instruction = "Complete a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].implemented=true Your explanation here'"
plan_review_instruction = "Audit a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].task_reviewed=true Your explanation here'"
implementation_review_instruction = "Review a task using: ./guard --api 'hierarchy.task.[{plan_id}].[TASK_ID].review_status=approved Your explanation here' or use rejected"
