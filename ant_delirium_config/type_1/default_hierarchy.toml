[hierarchy]
info = "Root taxonomy of Aesthetic Core Ant-Delirium. This node defines the default governance contract inherited by the whole project: naming style, separator policy, recursion behavior, repository anchoring, documentation obligations, and structural safety limits. Use this node to understand the baseline before inspecting a more specific DNA branch. Child nodes may override parts of this contract, but this root remains the authoritative starting point."
casing = "PascalCase"
name_separator = "-"
tag_separator = "_"
manifest = true
recursion = true
md_min_chars = 80
doc_tags = true
what_mission = true
why_justification = true
usage_example = true
test_case_mapping = true
inheritance_visibility = true
root_manifest = true
root_md_pairing = true
repository = ""
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"

[hierarchy.permissions]
info = "Global permission layer for dependency and token governance. This branch describes which external crates are allowed in the active project and which code tokens are restricted because they are noisy, unsafe, or hostile to review. Users typically edit this node when governance policy changes and the plugin must adapt its sanitization behavior."
libres = ["ac_ant_delirium", "rayon", "rusqlite", "sha2", "std"]
wrapper_boundary_contract = "explicit_ac_alias"
restricted_tokens = { "panic!" = "Security: Use Result.", "unwrap" = "Security: Use expect()." }

[hierarchy.files]
info = "Main file-governance branch. It defines the default structural and pedagogical expectations applied to governed source files before specialization into unit, struct, macro, or test DNA. This is the right place to describe broad file-level conventions such as density limits, parameter limits, and whether markdown pairing is expected by default."
max_nesting = 3
max_params = 5
logical_density = 40
else_free = true
else_free_allow_else_if = false
else_free_bypass_token = "[REASON]"
md_pairing = true
[hierarchy.target]
info = "Runtime target mapping used by the hierarchy engine to connect abstract taxonomy identifiers to real project folders. These values tell the search engine where core files, tests, and macros live in the current project layout. Edit this branch when folders move or when the active audit scope needs to be redirected without changing engine code."
core =  ["src/exemples_error/type1"]
tests = "src/tests"
macros = "src/macros"

[hierarchy.files.unit]
info = "Public-facing unit DNA. A unit file acts as the visible orchestration layer of a feature and is expected to expose public declarations or stable entry points. This branch keeps stricter structural limits than the root because unit files should stay shallow, reviewable, and heavily documented. Use this node when explaining the contract of top-level feature APIs."
jurisdiction = "src"
type_logic = ["pub fn", "pub async fn", "pub const fn", "pub unsafe fn", "pub(crate) fn", "pub(crate) async fn", "pub(crate) const fn"]
md_pairing = true
manifest = true
max_nesting = 2
max_params = 4
logical_density = 25
else_free = true

[hierarchy.files.unit.documentation]
info = "Documentation contract for public unit files. Each configured child tag becomes part of the public pedagogical contract. A tag is enforced only when its node exists under this documentation branch."

[hierarchy.files.unit.documentation.what]
min = 64
info = "Describe what this public unit function or declaration does in externally relevant terms."

[hierarchy.files.unit.documentation.why]
min = 64
info = "Explain why this public unit symbol exists and which design pressure or boundary it answers."

[hierarchy.files.unit.documentation.usage]
min = 64
info = "Explain how this public unit symbol should be called, consumed, or observed in practice."

[hierarchy.files.unit.documentation.test]
min = 48
info = "Describe the validation path, test scenario, or verification contract for this public unit symbol."

[hierarchy.files.unit.unitcore]
info = "Internal unitcore DNA. This branch describes the implementation-focused companion of a public unit file. Unitcore should contain lower-level logic that supports the parent unit without becoming the external API surface itself. Because it is internal, manifest generation is disabled here, while structural limits are slightly more permissive than the parent unit."
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
max_params = 6
logical_density = 40
else_free = true

[hierarchy.files.unit.unitcore.documentation]
info = "Documentation contract for unitcore declarations. Internal implementation symbols still need strong purpose and rationale, but their validation usually rises to the parent public unit surface."

[hierarchy.files.unit.unitcore.documentation.what]
min = 64
info = "Describe what this internal implementation symbol does."

[hierarchy.files.unit.unitcore.documentation.why]
min = 64
info = "Explain why this internal implementation exists in unitcore instead of the parent public unit layer."

[hierarchy.files.unit.unitcore.documentation.usage]
min = 64
info = "Explain how this internal implementation is invoked or composed by the parent unit."

[hierarchy.files.test]
info = "Test DNA branch. This node describes files dedicated to validation and specification checks. Test files are allowed to use test-oriented declaration patterns and usually do not need the same manifest or markdown-pairing obligations as production files. Use this branch to explain the intended governance model for test-only code."
jurisdiction = "src/tests"
type_logic = ["#[test]", "#[tokio::test]", "#[cfg(test)]"]
manifest = false
md_pairing = false
else_free = false

[hierarchy.files.struct]
info = "Structural type DNA for domain data definitions. This branch governs files that primarily declare structs, enums, and other long-lived shapes used by the rest of the system. These files remain strongly documented because they usually anchor shared understanding across multiple modules and revisions."
jurisdiction = "src/struct"
type_logic = ["struct", "pub struct", "enum", "pub enum"]
md_pairing = true
manifest = true
max_nesting = 3
max_params = 4
logical_density = 25
else_free = true

[hierarchy.files.struct.documentation]
info = "Documentation contract for structural type files. Each configured child tag becomes part of the stable contract expected from public domain shapes."

[hierarchy.files.struct.documentation.what]
min = 64
info = "Describe what this structural type or public declaration represents."

[hierarchy.files.struct.documentation.why]
min = 64
info = "Explain why this structural type exists and which domain or architectural need it stabilizes."

[hierarchy.files.struct.documentation.usage]
min = 64
info = "Explain how this structural type should be instantiated, consumed, or extended."

[hierarchy.files.struct.documentation.test]
min = 48
info = "Describe the validation path or invariants that prove this structural contract remains correct."

[hierarchy.files.struct.structcore]
info = "Internal structcore DNA. This branch covers helper functions and impl-level mechanics attached to structural type modules. Manifest generation is disabled because the parent struct DNA is expected to carry the public anchoring role, while structcore keeps implementation details close to the associated type."
type_logic = ["fn", "async fn", "const fn", "unsafe fn", "impl"]
manifest = false
max_nesting = 3
max_params = 4
logical_density = 30
else_free = true

[hierarchy.files.struct.structcore.documentation]
info = "Documentation contract for structcore internals. Helper logic around data structures stays documented, but test mapping belongs primarily to the public structural surface."

[hierarchy.files.struct.structcore.documentation.what]
min = 64
info = "Describe what this structcore helper or impl-level routine does."

[hierarchy.files.struct.structcore.documentation.why]
min = 64
info = "Explain why this structcore helper exists and why the logic stays attached to the structural layer."

[hierarchy.files.struct.structcore.documentation.usage]
min = 64
info = "Explain how this structcore helper is called or composed by the parent structural surface."

[hierarchy.files.macro]
info = "Macro DNA branch. This node governs macro-oriented files that define reusable code-generation surfaces. Because macros can hide complexity and become difficult to audit, this branch should stay explicit about the declaration forms that are allowed and the documentation quality expected from macro entry points."
jurisdiction = "src/macros"
type_logic = ["macro_rules!", "pub macro"]
md_pairing = true
manifest = true
max_nesting = 3
max_params = 4
logical_density = 25
else_free = true

[hierarchy.files.macro.documentation]
info = "Documentation contract for macro files. Public macro surfaces must expose purpose, rationale, placement, usage guidance, and validation mapping explicitly."
[hierarchy.files.macro.documentation.what]
min = 64
info = "Describe what code-generation or abstraction surface this macro provides."
[hierarchy.files.macro.documentation.why]
min = 64
info = "Explain why this macro exists instead of a plain function or type-level abstraction."
[hierarchy.files.macro.documentation.usage]
min = 64
info = "Explain how this macro should be invoked and what operational contract callers should expect."
[hierarchy.files.macro.documentation.test]
min = 48
info = "Describe the validation path or macro-level scenarios that prove this public macro contract."

[hierarchy.files.macro.macrocore]
info = "Internal macrocore DNA. This branch covers helper logic that supports macro behavior without being the primary macro declaration itself. It allows standard function-like implementation forms and disables manifest generation because the public macro layer is expected to hold the outward-facing documentation contract."
type_logic = ["fn", "async fn", "const fn", "unsafe fn"]
manifest = false
max_nesting = 3
logical_density = 40
else_free = true

[hierarchy.files.macro.macrocore.documentation]
info = "Documentation contract for macrocore helpers. Internal helpers still need strong intent and rationale, but test mapping is owned by the parent public macro surface."
[hierarchy.files.macro.macrocore.documentation.what]
min = 64
info = "Describe what this macrocore helper does for the macro expansion pipeline."
[hierarchy.files.macro.macrocore.documentation.why]
min = 64
info = "Explain why this helper exists in macrocore and what expansion concern it isolates."
[hierarchy.files.macro.macrocore.documentation.usage]
min = 64
info = "Explain how this macrocore helper is invoked or consumed by the parent macro layer."
